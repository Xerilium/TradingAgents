analysts: [market, social, news, fundamentals]
limits:
  max_debate_rounds: 1
  max_risk_discuss_rounds: 1
  max_tool_rounds: 20
  max_recur_limit: 100
nodes:
  Market Analyst: {handler: market, tier: fast}
  Sentiment Analyst: {handler: social, tier: fast}
  News Analyst: {handler: news, tier: fast}
  Fundamentals Analyst: {handler: fundamentals, tier: fast}
  Memory Log: {handler: memory}
  Bull Researcher: {handler: bull, tier: fast}
  Bear Researcher: {handler: bear, tier: fast}
  Research Manager: {handler: research_manager, tier: deep}
  Trader: {handler: trader, tier: fast}
  Aggressive Analyst: {handler: aggressive, tier: fast}
  Conservative Analyst: {handler: conservative, tier: fast}
  Neutral Analyst: {handler: neutral, tier: fast}
  Portfolio Manager: {handler: portfolio_manager, tier: deep}
edges:
  - {from: START, to: Market Analyst}
  - {from: START, to: Sentiment Analyst}
  - {from: START, to: News Analyst}
  - {from: START, to: Fundamentals Analyst}
  - {from: START, to: Memory Log}
  - from: [Market Analyst, Sentiment Analyst, News Analyst, Fundamentals Analyst, Memory Log]
    to: Bull Researcher
  - from: Bull Researcher
    router: research_debate
    paths: {Bull Researcher: Bull Researcher, Bear Researcher: Bear Researcher, Research Manager: Research Manager}
  - from: Bear Researcher
    router: research_debate
    paths: {Bull Researcher: Bull Researcher, Bear Researcher: Bear Researcher, Research Manager: Research Manager}
  - {from: Research Manager, to: Trader}
  - {from: Trader, to: Aggressive Analyst}
  - from: Aggressive Analyst
    router: risk_debate
    paths: {Aggressive Analyst: Aggressive Analyst, Conservative Analyst: Conservative Analyst, Neutral Analyst: Neutral Analyst, Portfolio Manager: Portfolio Manager}
  - from: Conservative Analyst
    router: risk_debate
    paths: {Aggressive Analyst: Aggressive Analyst, Conservative Analyst: Conservative Analyst, Neutral Analyst: Neutral Analyst, Portfolio Manager: Portfolio Manager}
  - from: Neutral Analyst
    router: risk_debate
    paths: {Aggressive Analyst: Aggressive Analyst, Conservative Analyst: Conservative Analyst, Neutral Analyst: Neutral Analyst, Portfolio Manager: Portfolio Manager}
  - {from: Portfolio Manager, to: END}
